name: seal-build

# Build-and-pack only: the tests (grunt lint+build on node 0.12 / 0.10 and the
# QUnit suite in headless Chrome) run on Travis from .travis.yml.
on:
  workflow_dispatch:

jobs:
  build-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write container build script
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/seal"
          cat > "$RUNNER_TEMP/seal/build.sh" <<'SEAL_BUILD_EOF'
          set -eu
          # build/tasks/build.js appends $COMMIT to the embedded version string.
          unset COMMIT
          # Reproducibility pins (1.11.3 was published 2015-04-28).
          # The uglify banner year is pinned as a source edit in Gruntfile.js;
          # fail loudly if that edit is missing.
          if grep -q "grunt.template.today" Gruntfile.js; then
            echo "Gruntfile.js still uses grunt.template.today; year pin missing"
            exit 1
          fi
          # @DATE pin lives here because edits under build/ are not captured.
          sed -i 's/( new Date() ).toISOString().replace( \/:\\d+\\.\\d+Z$\/, "Z" )/"2015-04-28T16:19Z"/' build/tasks/build.js
          if ! grep -q '"2015-04-28T16:19Z"' build/tasks/build.js; then
            echo "@DATE pin was not applied to build/tasks/build.js"
            exit 1
          fi
          npm config set registry https://time-machines-npm.sealsecurity.io/
          npm config set //time-machines-npm.sealsecurity.io/:_authToken 2015-04-28T16:22:06.378Z
          # npm 2 only sends the token when always-auth is on
          npm config set always-auth true
          node --version
          npm --version
          npm install
          # Full default task = `npm test`: jsonlint, build, jshint, jscs,
          # uglify, dist, compare_size.
          ./node_modules/.bin/grunt
          ls -la dist
          # Pack from a copy so the workspace ownership is left alone; npm 2
          # stores each file's uid/gid in the tar entry (reference: 501/20).
          rm -rf /tmp/pkg
          cp -a /work /tmp/pkg
          cd /tmp/pkg
          rm -rf node_modules .github .git seal-out
          # build/ is .npmignore'd, but restore nothing else: the packed tree
          # must equal the tag tree plus the regenerated (identical) dist/.
          chown -R 501:20 /tmp/pkg
          npm pack
          mkdir -p /work/seal-out
          cp jquery-1.11.3.tgz /work/seal-out/jquery-1.11.3.tgz
          tar tzvf /work/seal-out/jquery-1.11.3.tgz
          echo "member count: $(tar tzf /work/seal-out/jquery-1.11.3.tgz | wc -l)"
          chown -R "$HOST_UID:$HOST_GID" /work
          SEAL_BUILD_EOF

      - name: Build and pack (node 0.12 / npm 2, grunt)
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD":/work \
            -v "$RUNNER_TEMP/seal":/seal \
            -w /work \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            node:0.12 bash /seal/build.sh
          ls -la seal-out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jquery-npm
          path: seal-out/jquery-1.11.3.tgz
          if-no-files-found: error
